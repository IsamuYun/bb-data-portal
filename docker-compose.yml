services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bb}
      POSTGRES_DB: ${POSTGRES_DB:-bb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bb} -d ${POSTGRES_DB:-bb}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Host-only by default: Docker-published ports bypass the host firewall (UFW).
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bb}:${POSTGRES_PASSWORD:-bb}@postgres:5432/${POSTGRES_DB:-bb}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      APP_URL: ${APP_URL:-http://localhost:3000}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - media:/data/media
      - exports:/data/exports
    ports:
      # 0.0.0.0 = reachable on the LAN; behind a reverse proxy set WEB_BIND=127.0.0.1 (docs/deploy-ubuntu-24.md).
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  media:
  exports:
