<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>BB Collector 设置</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #222; }
      h1 { font-size: 18px; } h2 { font-size: 15px; margin-top: 1.5rem; }
      label { display: block; margin: 12px 0 4px; font-weight: 500; }
      input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; }
      button { margin-top: 12px; padding: 8px 14px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font: inherit; cursor: pointer; }
      button.secondary { background: #fff; color: #222; }
      .msg { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #f3f3f3; white-space: pre-wrap; }
      .ok { background: #e6f7ec; color: #116632; } .err { background: #fdecec; color: #9a1b1b; }
      code { background: #f3f3f3; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>BB Collector 设置</h1>
    <div id="status" class="msg"></div>

    <h2>配对</h2>
    <label for="serverUrl">服务器地址</label>
    <input id="serverUrl" placeholder="http://localhost:3000" />
    <label for="deviceName">设备名称</label>
    <input id="deviceName" placeholder="例如：办公室 Chrome" />
    <label for="code">配对码（后台“设备”页生成）</label>
    <input id="code" placeholder="例如 7K3MQ2" autocomplete="off" />
    <button id="pair">配对</button>
    <button id="unpair" class="secondary">解除配对</button>
    <div id="msg" class="msg" hidden></div>

    <h2>说明</h2>
    <p>插件会在后台每 5–30 秒向服务器领取任务，在一个独立的工作标签页里执行服务器下发的 Recipe。请保持目标站点在本 Chrome 中处于登录状态。</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
