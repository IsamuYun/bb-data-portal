# Production override for a public server (Ubuntu 24.04, see docs/deploy-ubuntu-24.md):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Port binding is set in .env (POSTGRES_BIND / WEB_BIND, both 127.0.0.1 behind Caddy); this file adds log rotation
# so container logs cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    logging: *logging
  web:
    logging: *logging
