name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bb, POSTGRES_PASSWORD: bb, POSTGRES_DB: bb }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bb" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://bb:bb@localhost:5432/bb
      AUTH_SECRET: ci-secret-ci-secret-ci-secret
      SKIP_MIGRATIONS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/Dockerfile.web, push: false }
